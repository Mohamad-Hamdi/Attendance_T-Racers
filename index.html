<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-RACERS MEC — Attendance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --ink: #201A3D; --muted: #726C93;
    --line: #E4E1EF; --navy: #241a5e; --red: #c8202a; --accent-ink: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 18px 60px; }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand img { width: 96px; height: 96px; object-fit: contain; }
  .brand .brandname { font-weight: 800; letter-spacing: .06em; color: var(--red); font-size: 1.15rem; margin-top: 6px; }
  .brand .brandsub { color: var(--navy); font-size: .72rem; letter-spacing: .3em; font-weight: 600; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; color: var(--navy); }
  .sub { color: var(--muted); font-size: .92rem; margin: 0 0 20px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(36,26,94,0.06);
  }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 5px; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
    background: #FCFBFF; color: var(--ink); font-size: 1rem; font-family: inherit;
  }
  button {
    display: inline-block; padding: 11px 18px; border-radius: 9px; border: none;
    background: var(--navy); color: var(--accent-ink); font-size: .95rem; font-weight: 600;
    cursor: pointer; margin-top: 14px; width: 100%;
  }
  button.cta { background: var(--red); }
  button.secondary { background: transparent; color: var(--navy); border: 1px solid var(--line); }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  input[type="time"] { width: 100%; min-width: 0; }
  .days-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .day-chip { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px; font-size: .82rem; cursor: pointer; user-select: none; }
  .day-chip input { width: auto; margin: 0; }
  .day-chip.checked { background: rgba(36,26,94,0.08); border-color: var(--navy); color: var(--navy); font-weight: 600; }
  .msg { padding: 12px 14px; border-radius: 9px; font-size: .92rem; margin-top: 12px; }
  .msg.good { background: rgba(36,26,94,0.08); color: var(--navy); }
  .msg.bad { background: rgba(200,32,42,0.10); color: var(--red); }
  .session-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .session-item:last-child { border-bottom: none; }
  .session-name { font-weight: 700; color: var(--navy); }
  .session-meta { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .session-actions { display: flex; gap: 8px; margin-top: 8px; }
  .session-actions button { margin-top: 0; width: auto; padding: 7px 12px; font-size: .85rem; }
  #qrbox { display: flex; justify-content: center; padding: 16px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--navy); }
  .small { font-size: .82rem; color: var(--muted); }
  .link-like { color: var(--red); background: none; border: none; padding: 0; font-weight: 600; width: auto; text-decoration: underline; }
</style>
</head>

const qs = new URLSearchParams(location.search);
const SESSION_ID = qs.get('session');
const API_FROM_LINK = qs.get('api');
const app = document.getElementById('app');

function getApiUrl() {
  if (API_FROM_LINK) return decodeURIComponent(API_FROM_LINK);
  return localStorage.getItem('attendance_api_url') || '';
}
function setApiUrl(v) { localStorage.setItem('attendance_api_url', v); }

async function apiGet(params) {
  const url = getApiUrl() + '?' + new URLSearchParams(params).toString();
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(t);
    return await res.json();
  } catch (err) {
    clearTimeout(t);
    return { ok: false, error: 'network_error' };
  }
}
async function apiPost(body) {
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), 20000);
  try {
    const res = await fetch(getApiUrl(), { method: 'POST', body: JSON.stringify(body), signal: controller.signal });
    clearTimeout(t);
    return await res.json();
  } catch (err) {
    clearTimeout(t);
    return { ok: false, error: 'network_error' };
  }
}

const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function daysLabel(csv) {
  return String(csv).split(',').map((d) => DAY_NAMES[parseInt(d, 10)] || '?').join(', ');
}

function brandHeader() {
  return `<div class="brand"><img src="${LOGO_SRC}" alt="T-RACERS MEC logo"></div>`;
}

// ---------- STUDENT VIEW ----------
async function renderStudent() {
  app.innerHTML = `${brandHeader()}<h1>Attendance Check-In</h1><p class="sub" id="subtitle">Loading session...</p><div class="card" id="card"></div>`;
  if (!getApiUrl()) {
    document.getElementById('subtitle').textContent = 'No API link found for this QR code.';
    document.getElementById('card').innerHTML = `<p class="small">This QR code link looks incomplete. Ask the session organizer for a fresh one.</p>`;
    return;
  }
  const r = await apiGet({ action: 'getSession', id: SESSION_ID });
  if (!r.ok) {
    document.getElementById('subtitle').textContent = 'This session was not found.';
    return;
  }
  const s = r.session;
  document.getElementById('subtitle').textContent = s.name;
  document.getElementById('card').innerHTML = `
    <p class="small">Open ${daysLabel(s.days)} · ${s.startTime}–${s.endTime}</p>
    <label for="sname">Your name</label>
    <input id="sname" placeholder="Enter your full name">
    <button class="cta" id="checkinBtn">Check In</button>
    <div id="statusMsg"></div>
  `;
  document.getElementById('checkinBtn').onclick = async () => {
    const name = document.getElementById('sname').value.trim();
    const statusEl = document.getElementById('statusMsg');
    if (!name) { statusEl.innerHTML = '<div class="msg bad">Please enter your name first</div>'; return; }
    const btn = document.getElementById('checkinBtn');
    btn.disabled = true; btn.textContent = 'Getting your location...';
    if (!navigator.geolocation) {
      statusEl.innerHTML = '<div class="msg bad">This device does not support location</div>';
      btn.disabled = false; btn.textContent = 'Check In'; return;
    }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      btn.textContent = 'Submitting...';
      const res = await apiPost({
        action: 'checkIn', sessionId: SESSION_ID, studentName: name,
        lat: pos.coords.latitude, lng: pos.coords.longitude,
      });
      if (res.ok) {
        statusEl.innerHTML = '<div class="msg good">You\'re checked in ✓</div>';
        btn.remove();
      } else {
        const map = {
          wrong_day: 'Check-in is not open today.',
          outside_time_window: 'Check-in is only open during the session time.',
          outside_location: 'You need to be inside the session location to check in.',
          session_not_found: 'Session not found.',
        };
        statusEl.innerHTML = `<div class="msg bad">${map[res.error] || 'Something went wrong, please try again'}</div>`;
        btn.disabled = false; btn.textContent = 'Try Again';
      }
    }, () => {
      statusEl.innerHTML = '<div class="msg bad">You need to allow location access to check in</div>';
      btn.disabled = false; btn.textContent = 'Check In';
    });
  };
}

// ---------- ADMIN VIEW ----------
function renderApiSetup() {
  app.innerHTML = `${brandHeader()}
    <h1>Attendance Dashboard</h1>
    <p class="sub">First time here? Paste your Google Apps Script API link</p>
    <div class="card">
      <label for="apiInput">Web App URL</label>
      <input id="apiInput" placeholder="https://script.google.com/macros/s/.../exec" value="${getApiUrl()}">
      <button id="saveApi">Save</button>
    </div>`;
  document.getElementById('saveApi').onclick = () => {
    const v = document.getElementById('apiInput').value.trim();
    if (v) { setApiUrl(v); renderAdmin(); }
  };
}

async function renderAdmin() {
  app.innerHTML = `${brandHeader()}
    <h1>Attendance Dashboard</h1>
    <p class="sub">Create a new session or manage existing ones</p>
    <div class="card">
      <label for="name">Session name</label>
      <input id="name" placeholder="e.g. Sunday Lecture — Hall 3">
      <div class="row">
        <div>
          <label for="lat">Latitude</label>
          <input id="lat" placeholder="30.0444">
        </div>
        <div>
          <label for="lng">Longitude</label>
          <input id="lng" placeholder="31.2357">
        </div>
      </div>
      <button class="secondary" id="useLoc">Use my current location (if standing there now)</button>
      <label for="radius">Allowed radius (meters)</label>
      <input id="radius" type="number" value="40">
      <label>Repeats on</label>
      <div class="days-grid" id="daysGrid">
        ${DAY_NAMES.map((d, i) => `
          <label class="day-chip" data-i="${i}">
            <input type="checkbox" value="${i}"> ${d}
          </label>`).join('')}
      </div>
      <div class="row">
        <div>
          <label for="start">Start time</label>
          <input id="start" type="time">
        </div>
        <div>
          <label for="end">End time</label>
          <input id="end" type="time">
        </div>
      </div>
      <p class="small">This QR code will keep working every week, only on the checked days and inside this time window.</p>
      <button class="cta" id="createBtn">Create Session + QR Code</button>
      <div id="createMsg"></div>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="color:var(--navy)">Sessions</strong>
        <button class="link-like" id="changeApi">Change API link</button>
      </div>
      <div id="sessionsList" class="small">Loading...</div>
    </div>
  `;

  document.getElementById('changeApi').onclick = renderApiSetup;

  document.querySelectorAll('.day-chip input').forEach((cb) => {
    cb.addEventListener('change', () => cb.closest('.day-chip').classList.toggle('checked', cb.checked));
  });

  document.getElementById('useLoc').onclick = () => {
    navigator.geolocation.getCurrentPosition((pos) => {
      document.getElementById('lat').value = pos.coords.latitude.toFixed(6);
      document.getElementById('lng').value = pos.coords.longitude.toFixed(6);
    }, () => alert('Please allow location access'));
  };

  document.getElementById('createBtn').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    const lat = document.getElementById('lat').value;
    const lng = document.getElementById('lng').value;
    const radius = document.getElementById('radius').value || 40;
    const days = Array.from(document.querySelectorAll('.day-chip input:checked')).map((cb) => cb.value);
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    const msgEl = document.getElementById('createMsg');
    if (!name || !lat || !lng || !start || !end || !days.length) {
      msgEl.innerHTML = '<div class="msg bad">Please fill in all fields and pick at least one day</div>'; return;
    }
    msgEl.innerHTML = '';
    const r = await apiPost({
      action: 'createSession', name, lat, lng, radius,
      days, startTime: start, endTime: end,
    });
    if (r.ok) {
      msgEl.innerHTML = '<div class="msg good">Session created ✓</div>';
      document.getElementById('name').value = '';
      loadSessions();
    } else {
      msgEl.innerHTML = '<div class="msg bad">Something went wrong — check your API link</div>';
    }
  };

  loadSessions();
}

function renderSessionList(sessions) {
  const listEl = document.getElementById('sessionsList');
  if (!sessions.length) { listEl.innerHTML = 'No sessions yet.'; return; }
  listEl.innerHTML = '';
  sessions.slice().reverse().forEach((s) => {
    const div = document.createElement('div');
    div.className = 'session-item';
    div.innerHTML = `
      <div class="session-name">${s.name}</div>
      <div class="session-meta">${daysLabel(s.days)} · ${s.startTime}–${s.endTime} · radius ${s.radius}m</div>
      <div class="session-actions">
        <button data-act="qr">QR Code</button>
        <button data-act="att" class="secondary">Attendees</button>
      </div>
      <div class="expand"></div>
    `;
    const expand = div.querySelector('.expand');
    div.querySelector('[data-act="qr"]').onclick = () => {
      const link = `${location.origin}${location.pathname}?session=${s.id}&api=${encodeURIComponent(getApiUrl())}`;
      if (typeof QRCode === 'undefined') {
        expand.innerHTML = `<p class="msg bad">The QR library didn't load (check your connection and refresh). Here's the link instead:</p><p class="small" style="word-break:break-all;">${link}</p>`;
        return;
      }
      expand.innerHTML = `<div id="qrbox"></div><p class="small" style="text-align:center; word-break:break-all;">${link}</p>`;
      new QRCode(expand.querySelector('#qrbox'), { text: link, width: 200, height: 200 });
    };
    div.querySelector('[data-act="att"]').onclick = async () => {
      expand.innerHTML = 'Loading...';
      const ar = await apiGet({ action: 'listAttendance', id: s.id });
      if (!ar.ok) { expand.innerHTML = '<p class="msg bad">Couldn\\'t load attendees. Try again.</p>'; return; }
      if (!ar.attendance.length) { expand.innerHTML = '<p class="small">No check-ins yet.</p>'; return; }
      const rows = ar.attendance.map(a => `<tr><td>${a.studentName}</td><td>${fmtTime(a.timestamp)}</td></tr>`).join('');
      expand.innerHTML = `<table><tr><th>Name</th><th>Time</th></tr>${rows}</table>`;
    };
    listEl.appendChild(div);
  });
}

async function loadSessions() {
  const listEl = document.getElementById('sessionsList');
  const cacheKey = 'attendance_sessions_cache';
  const cached = localStorage.getItem(cacheKey);
  if (cached) {
    try { renderSessionList(JSON.parse(cached)); } catch {}
  } else {
    listEl.innerHTML = 'Loading...';
  }
  const r = await apiGet({ action: 'listSessions' });
  if (!r.ok) {
    if (!cached) listEl.innerHTML = '<p class="msg bad">Couldn\\'t reach the API. Check the link and your connection, then reopen this page.</p>';
    return;
  }
  localStorage.setItem(cacheKey, JSON.stringify(r.sessions));
  renderSessionList(r.sessions);
}

// ---------- ROUTER ----------
if (SESSION_ID) {
  renderStudent();
} else if (!getApiUrl()) {
  renderApiSetup();
} else {
  renderAdmin();
}
</script>
